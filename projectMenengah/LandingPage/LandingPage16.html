<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll to Top</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, sans-serif;
        }

        .content {
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 24px;
            color: #0f172a;
        }

        .content p {
            margin-bottom: 20px;
            line-height: 1.8;
            color: #475569;
        }

        .spacer {
            height: 200vh;
        }

        .scroll-to-top {
            position: fixed;
            bottom: 32px;
            right: 32px;
            width: 52px;
            height: 52px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            z-index: 999;
        }

        .scroll-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-to-top:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        .scroll-to-top:active {
            transform: scale(0.95);
        }

        @media (max-width: 640px) {
            .scroll-to-top {
                bottom: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <div class="content">
        <h1>Scroll ke Bawah</h1>
        <p>Tombol scroll-to-top akan muncul di pojok kanan bawah saat Anda scroll ke bawah halaman ini.</p>
        <div class="spacer"></div>
        <p>Anda telah mencapai bagian bawah halaman. Klik tombol panah ke atas untuk kembali ke atas dengan mulus.</p>
        <div class="spacer"></div>
        <p>Bagian paling bawah. Tombol scroll-to-top siap membantu Anda kembali.</p>
    </div>
    <button class="scroll-to-top" id="scrollToTopBtn" aria-label="Scroll to top">↑</button>
    <script>
        const scrollToTopBtn = document.getElementById('scrollToTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollToTopBtn.classList.add('visible');
            } else {
                scrollToTopBtn.classList.remove('visible');
            }
        });
        scrollToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>

</html>
