<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design System</title>
    <style>
        :root {
            --color-primary: #2563eb;
            --color-primary-dark: #1d4ed8;
            --color-secondary: #7c3aed;
            --color-accent: #f59e0b;
            --color-neutral-50: #f8fafc;
            --color-neutral-100: #f1f5f9;
            --color-neutral-200: #e2e8f0;
            --color-neutral-700: #334155;
            --color-neutral-800: #1e293b;
            --color-neutral-900: #0f172a;
            --color-success: #10b981;
            --color-error: #ef4444;
            --font-heading: 'Segoe UI', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, sans-serif;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.25rem;
            --font-size-2xl: 1.5rem;
            --font-size-3xl: 1.875rem;
            --font-size-4xl: 2.25rem;
            --line-height-tight: 1.25;
            --line-height-normal: 1.6;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            font-size: var(--font-size-base);
            line-height: var(--line-height-normal);
            color: var(--color-neutral-800);
            background: var(--color-neutral-50);
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1,
        h2,
        h3 {
            font-family: var(--font-heading);
            line-height: var(--line-height-tight);
            color: var(--color-neutral-900);
        }

        h1 {
            font-size: var(--font-size-4xl);
            margin-bottom: 16px;
        }

        h2 {
            font-size: var(--font-size-2xl);
            margin-bottom: 12px;
        }

        .color-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 24px 0;
        }

        .color-swatch {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: flex-end;
            padding: 8px;
            font-size: var(--font-size-sm);
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin: 16px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Design System</h1>
        <div class="card">
            <h2>Color Palette</h2>
            <div class="color-palette">
                <div class="color-swatch" style="background:var(--color-primary);color:white">Primary</div>
                <div class="color-swatch" style="background:var(--color-secondary);color:white">Secondary</div>
                <div class="color-swatch" style="background:var(--color-accent);color:white">Accent</div>
                <div class="color-swatch" style="background:var(--color-neutral-900);color:white">Dark</div>
                <div class="color-swatch" style="background:var(--color-neutral-700);color:white">Text</div>
                <div class="color-swatch" style="background:var(--color-success);color:white">Success</div>
                <div class="color-swatch" style="background:var(--color-error);color:white">Error</div>
            </div>
        </div>
        <div class="card">
            <h2>Typography</h2>
            <p style="font-size:var(--font-size-sm)">Small text (0.875rem)</p>
            <p style="font-size:var(--font-size-base)">Base text (1rem)</p>
            <p style="font-size:var(--font-size-lg)">Large text (1.125rem)</p>
            <button class="btn btn-primary">Tombol CTA</button>
        </div>
    </div>
</body>

</html>
