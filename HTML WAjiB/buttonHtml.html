<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f6fa;
        }

        .button-demo {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            border: 2px solid #bdc3c7;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        button:hover {
            background: #f0f0f0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn {
            border: none;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #3498db;
            color: #3498db;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-lg {
            padding: 14px 28px;
            font-size: 18px;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <div class="button-demo">
        <h1>Demo Tag Button</h1>

        <form id="demoForm">
            <div>
                <label for="namaInput">Nama:</label>
                <input type="text" id="namaInput" value="John Doe">
            </div>

            <div class="button-group">
                <button type="submit">Submit (kirim form)</button>
                <button type="button" id="btnAlert">Button (alert saja)</button>
                <button type="reset">Reset (kembalikan form)</button>
                <button type="button" id="btnDisabled" disabled>Disabled</button>
            </div>
        </form>

        <div class="custom-buttons">
            <h2>Button dengan Style</h2>
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-secondary">Secondary</button>
            <button class="btn btn-success">Success</button>
            <button class="btn btn-danger">Danger</button>
            <button class="btn btn-outline">Outline</button>
            <button class="btn btn-sm">Small</button>
            <button class="btn btn-lg">Large</button>
        </div>

        <div id="output"></div>
    </div>
    <script>
        document.getElementById('demoForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var nama = document.getElementById('namaInput').value;
            document.getElementById('output').textContent = 'Form disubmit dengan nama: ' + nama;
        });

        document.getElementById('btnAlert').addEventListener('click', function () {
            document.getElementById('output').textContent = 'Tombol "button" diklik - tidak mengirim form';
        });

        document.querySelectorAll('.btn:not(#btnDisabled)').forEach(function (btn) {
            btn.addEventListener('click', function () {
                document.getElementById('output').textContent = 'Tombol ' + this.textContent + ' diklik';
            });
        });
    </script>
</body>

</html>
