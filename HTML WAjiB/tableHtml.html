<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel HTML</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f6fa;
        }

        .table-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #2c3e50;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f8f9fa;
        }

        tfoot td {
            background: #e8f4f8;
            font-weight: bold;
            border-top: 2px solid #2c3e50;
        }

        tfoot td:last-child {
            color: #27ae60;
        }
    </style>
</head>

<body>
    <div class="table-container">
        <h2>Data Penjualan</h2>
        <table>
            <thead>
                <tr>
                    <th>Produk</th>
                    <th>Kategori</th>
                    <th>Harga</th>
                    <th>Terjual</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Laptop</td>
                    <td>Elektronik</td>
                    <td>Rp 10.000.000</td>
                    <td>15</td>
                    <td>Rp 150.000.000</td>
                </tr>
                <tr>
                    <td>Mouse</td>
                    <td>Aksesoris</td>
                    <td>Rp 150.000</td>
                    <td>50</td>
                    <td>Rp 7.500.000</td>
                </tr>
                <tr>
                    <td>Keyboard</td>
                    <td>Aksesoris</td>
                    <td>Rp 350.000</td>
                    <td>30</td>
                    <td>Rp 10.500.000</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3"><strong>Total Keseluruhan</strong></td>
                    <td><strong>95</strong></td>
                    <td><strong>Rp 168.000.000</strong></td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>

</html>
