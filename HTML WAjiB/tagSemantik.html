<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            border: solid black 2px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .site-header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 200;
        }

        main {
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
            flex: 1;
        }

        article {
            flex: 2;
        }

        aside {
            flex: 1;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        footer {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <h1>Website Saya</h1>
        <nav>
            <ul>
                <li><a href="_blank">home</a></li>
                <li><a href="_blank">blog</a></li>
                <li><a href="_blank">contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <article>
            <h2>Judul Artikel</h2>
            <p>ini adalah konten artikel utama. Tag article digunakan untuk konten independen</p>
            <section>
                <h3>Sub-bagian 1</h3>
                <p>Section digunakan untuk mengelompokkan konten bertema sama</p>
            </section>
        </article>
        <aside>
            <h3>Sidebar</h3>
            <p>Konten terkait atau tambahan</p>
        </aside>
    </main>
    <footer>
        <p>&copy; 2024 Website Saya</p>
    </footer>
</body>

</html>
