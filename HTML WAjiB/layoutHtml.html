<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Container Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f0f2f5;
        }

        .app-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content-wrapper {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 250px;
            background: #34495e;
            color: white;
            padding: 20px;
        }

        .menu-item {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            padding: 20px;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .card-header {
            background: #3498db;
            color: white;
            padding: 12px 16px;
            font-weight: bold;
        }

        .card-body {
            padding: 16px;
        }

        .card-footer {
            background: #f8f9fa;
            padding: 10px 16px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #666;
            text-align: right;
        }

        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="app-wrapper">
        <div class="header">
            <h1>Layout dengan Div</h1>
        </div>
        <div class="content-wrapper">
            <div class="sidebar">
                <h3>Sidebar</h3>
                <div class="menu-item">Menu 1</div>
                <div class="menu-item">Menu 2</div>
                <div class="menu-item">Menu 3</div>
            </div>
            <div class="main-content">
                <h2>Konten Utama</h2>
                <div class="card-container">
                    <div class="card">
                        <div class="card-header">Card 1</div>
                        <div class="card-body">Ini adalah body card 1.</div>
                        <div class="card-footer">Footer</div>
                    </div>
                    <div class="card">
                        <div class="card-header">Card 2</div>
                        <div class="card-body">Ini adalah body card 2.</div>
                        <div class="card-footer">Footer</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2024 Layout Div</p>
        </div>
    </div>
</body>

</html>
