<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
        }

        .hero-wireframe {
            width: 100%;
            height: 100vh;
            background: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .hero-content {
            width: 100%;
            max-width: 1000px;
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: space-between;
        }

        .text-area {
            flex: 1;
        }

        .wire-headline {
            height: 40px;
            width: 80%;
            background: #ccc;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .wire-subheadline {
            height: 20px;
            width: 60%;
            background: #ccc;
            border-radius: 4px;
            margin-bottom: 24px;
        }

        .wire-cta {
            height: 48px;
            width: 160px;
            background: #aaa;
            border-radius: 24px;
        }

        .wire-image {
            width: 400px;
            height: 400px;
            background: #ccc;
            border-radius: 16px;
        }

        @media (max-width: 768px) {
            .hero-content {
                flex-direction: column;
                text-align: center;
            }

            .wire-image {
                width: 280px;
                height: 280px;
            }

            .wire-headline {
                width: 100%;
            }
        }

        .label {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="hero-wireframe">
        <div class="hero-content">
            <div class="text-area">
                <div class="wire-headline"></div>
                <div class="wire-subheadline"></div>
                <div class="wire-cta"></div>
            </div>
            <div class="wire-image"></div>
        </div>
    </div>
    <div class="label">Wireframe Hero Section — Teks Kiri, Gambar Kanan</div>
</body>

</html>
