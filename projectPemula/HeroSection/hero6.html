<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - CTA Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 24px;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        .hero h1 {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 800;
            color: white;
            margin-bottom: 16px;
        }

        .hero p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }

        .cta-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cta-primary {
            position: relative;
            display: inline-block;
            padding: 16px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
            z-index: 1;
        }

        .cta-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #764ba2, #667eea);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .cta-primary:hover::before {
            left: 0;
        }

        .cta-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .cta-secondary {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .cta-secondary:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-3px);
        }

        .cta-pulse {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            animation: pulse 2s infinite;
            margin-top: 20px;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.6);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(102, 126, 234, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
            }
        }
    </style>
</head>

<body>
    <section class="hero">
        <h1>CTA Hover Animations</h1>
        <p>Coba arahkan kursor ke tombol-tombol di bawah ini</p>
        <div class="cta-group">
            <a href="#" class="cta-primary">Slide Effect</a>
            <a href="#" class="cta-secondary">Outline Style</a>
        </div>
        <a href="#" class="cta-pulse">Pulse Effect</a>
    </section>
</body>

</html>
