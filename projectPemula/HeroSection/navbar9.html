<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Floating Elements</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 24px;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            position: relative;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: float 6s ease-in-out infinite;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: #667eea;
            top: -80px;
            right: -60px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            background: #764ba2;
            bottom: -40px;
            left: -40px;
            animation-delay: -2s;
        }

        .shape-3 {
            width: 120px;
            height: 120px;
            background: #667eea;
            top: 40%;
            left: 10%;
            animation-delay: -4s;
        }

        .shape-4 {
            width: 60px;
            height: 60px;
            background: #764ba2;
            top: 20%;
            right: 20%;
            animation-delay: -1s;
            border-radius: 0;
            transform: rotate(45deg);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .hero h1 {
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 800;
            color: white;
            max-width: 700px;
            line-height: 1.2;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .hero h1 span {
            color: #667eea;
        }

        .hero p {
            font-size: clamp(16px, 2.2vw, 20px);
            color: rgba(255, 255, 255, 0.65);
            max-width: 550px;
            line-height: 1.7;
            margin-bottom: 36px;
            position: relative;
            z-index: 1;
        }

        .hero-cta {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 16px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .hero-cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
        }
    </style>
</head>

<body>
    <section class="hero">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <h1>Desain <span>Modern</span> dengan Elemen Floating</h1>
        <p>Elemen dekoratif melayang memberikan kesan dinamis dan hidup pada halaman hero section website Anda.</p>
        <a href="#" class="hero-cta">Jelajahi</a>
    </section>
</body>

</html>
