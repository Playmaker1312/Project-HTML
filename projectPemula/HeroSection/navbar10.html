<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Final Responsive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: clamp(24px, 5vw, 60px);
            padding: clamp(40px, 6vw, 80px);
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            flex: 1;
            max-width: 540px;
        }

        .hero-content .badge {
            display: inline-block;
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: clamp(11px, 1.5vw, 13px);
            font-weight: 600;
            margin-bottom: clamp(12px, 2vw, 16px);
        }

        .hero-content h1 {
            font-size: clamp(28px, 5.5vw, 52px);
            font-weight: 800;
            color: white;
            line-height: 1.15;
            margin-bottom: clamp(12px, 2vw, 20px);
        }

        .hero-content h1 span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p {
            font-size: clamp(14px, 2vw, 18px);
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.7;
            margin-bottom: clamp(24px, 4vw, 36px);
        }

        .hero-content .cta {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: clamp(12px, 2vw, 16px) clamp(28px, 4vw, 40px);
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: clamp(14px, 1.5vw, 15px);
            transition: all 0.3s;
        }

        .hero-content .cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image img {
            width: 100%;
            max-width: clamp(300px, 40vw, 520px);
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background: #667eea;
            top: -100px;
            right: -100px;
        }

        .shape-2 {
            width: 250px;
            height: 250px;
            background: #764ba2;
            bottom: -80px;
            left: -80px;
        }

        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                text-align: center;
                min-height: auto;
                padding: 60px 24px;
            }

            .hero-content {
                max-width: 100%;
            }

            .hero-image img {
                max-width: 100%;
            }

            .shape-1 {
                width: 200px;
                height: 200px;
                top: -50px;
                right: -50px;
            }

            .shape-2 {
                width: 150px;
                height: 150px;
                bottom: -40px;
                left: -40px;
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding: 40px 16px;
            }

            .hero-image img {
                border-radius: 12px;
            }
        }
    </style>
</head>

<body>
    <section class="hero">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="hero-content">
            <span class="badge">✨ Solusi Digital</span>
            <h1>Transformasi <span>Digital</span> untuk Bisnis Anda</h1>
            <p>Kami menghadirkan solusi website modern yang responsif, cepat, dan mudah dikelola untuk mengembangkan
                bisnis Anda.</p>
            <a href="#" class="cta">Mulai Sekarang</a>
        </div>
        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600&q=80" alt="Ilustrasi Digital">
        </div>
    </section>
</body>

</html>
