<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Grid - Filter JavaScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            padding: 60px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            color: #2d3436;
            margin-bottom: 8px;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #e0e0e0;
            background: white;
            color: #636e72;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .card-body h3 {
            font-size: 18px;
            color: #2d3436;
            margin-bottom: 6px;
        }

        .card-body p {
            font-size: 14px;
            color: #636e72;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Filter Gallery</h2>
        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="web">Web Design</button>
            <button class="filter-btn" data-filter="mobile">Mobile App</button>
            <button class="filter-btn" data-filter="dashboard">Dashboard</button>
        </div>
        <div class="grid" id="cardGrid">
            <div class="card" data-category="web"><img
                    src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=400&q=80" alt="">
                <div class="card-body">
                    <h3>Company Profile</h3>
                    <p>Website company profile modern.</p>
                </div>
            </div>
            <div class="card" data-category="mobile"><img
                    src="https://images.unsplash.com/photo-1551650975-87deedd944c3?w=400&q=80" alt="">
                <div class="card-body">
                    <h3>E-commerce App</h3>
                    <p>Aplikasi belanja online.</p>
                </div>
            </div>
            <div class="card" data-category="dashboard"><img
                    src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400&q=80" alt="">
                <div class="card-body">
                    <h3>Analytics Dashboard</h3>
                    <p>Dashboard data real-time.</p>
                </div>
            </div>
            <div class="card" data-category="web"><img
                    src="https://images.unsplash.com/photo-1522542550221-31fd19575a2d?w=400&q=80" alt="">
                <div class="card-body">
                    <h3>Landing Page</h3>
                    <p>Landing page konversi tinggi.</p>
                </div>
            </div>
            <div class="card" data-category="mobile"><img
                    src="https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=400&q=80" alt="">
                <div class="card-body">
                    <h3>Social App</h3>
                    <p>Aplikasi media sosial.</p>
                </div>
            </div>
            <div class="card" data-category="dashboard"><img
                    src="https://images.unsplash.com/photo-1553877522-43269d4ea984?w=400&q=80" alt="">
                <div class="card-body">
                    <h3>Admin Panel</h3>
                    <p>Panel administrasi website.</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.card');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function () {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const filterValue = this.getAttribute('data-filter');
                cards.forEach(card => {
                    if (filterValue === 'all' || card.getAttribute('data-category') === filterValue) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>

</html>
