<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Grid - Image Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            padding: 60px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        .card-image-wrap {
            position: relative;
            overflow: hidden;
        }

        .card-image-wrap img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .card:hover .card-image-wrap img {
            transform: scale(1.1);
        }

        .card-image-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.8));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .card-image-wrap::after {
            opacity: 1;
        }

        .card-image-wrap .overlay-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            color: white;
            font-size: 40px;
            z-index: 2;
            transition: transform 0.3s ease 0.1s;
        }

        .card:hover .card-image-wrap .overlay-icon {
            transform: translate(-50%, -50%) scale(1);
        }

        .card-body {
            padding: 24px;
        }

        .card-body h3 {
            font-size: 18px;
            color: #2d3436;
            margin-bottom: 6px;
        }

        .card-body p {
            font-size: 14px;
            color: #636e72;
            line-height: 1.6;
        }

        h2 {
            text-align: center;
            font-size: 32px;
            color: #2d3436;
            margin-bottom: 36px;
        }
    </style>
</head>

<body>
    <h2>Image Overlay Effect</h2>
    <div class="grid">
        <div class="card">
            <div class="card-image-wrap">
                <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=400&q=80" alt="">
                <div class="overlay-icon">🔍</div>
            </div>
            <div class="card-body">
                <h3>Web Design</h3>
                <p>Desain website modern dan responsif untuk berbagai kebutuhan bisnis.</p>
            </div>
        </div>
        <div class="card">
            <div class="card-image-wrap">
                <img src="https://images.unsplash.com/photo-1551650975-87deedd944c3?w=400&q=80" alt="">
                <div class="overlay-icon">🔍</div>
            </div>
            <div class="card-body">
                <h3>Mobile App</h3>
                <p>Aplikasi mobile dengan performa tinggi dan UI yang intuitif.</p>
            </div>
        </div>
        <div class="card">
            <div class="card-image-wrap">
                <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400&q=80" alt="">
                <div class="overlay-icon">🔍</div>
            </div>
            <div class="card-body">
                <h3>Dashboard</h3>
                <p>Dashboard analitik dengan visualisasi data interaktif.</p>
            </div>
        </div>
    </div>
</body>

</html>
