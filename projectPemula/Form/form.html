<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Perencanaan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-wireframe {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .wire-label {
            height: 14px;
            width: 80px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-bottom: 8px;
        }

        .wire-input {
            height: 44px;
            width: 100%;
            background: #e0e0e0;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .wire-textarea {
            height: 120px;
            width: 100%;
            background: #e0e0e0;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .wire-btn {
            height: 48px;
            width: 100%;
            background: #ccc;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #2d3436;
        }
    </style>
</head>

<body>
    <div class="form-wireframe">
        <h2>Wireframe Contact Form</h2>
        <div class="wire-label"></div>
        <div class="wire-input"></div>
        <div class="wire-label"></div>
        <div class="wire-input"></div>
        <div class="wire-label"></div>
        <div class="wire-input"></div>
        <div class="wire-label"></div>
        <div class="wire-textarea"></div>
        <div class="wire-btn"></div>
    </div>
</body>

</html>
