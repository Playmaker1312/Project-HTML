<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - ARIA Accessibility</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #667eea;
            outline-offset: 2px;
            border-color: #667eea;
        }

        input[aria-invalid="true"],
        textarea[aria-invalid="true"] {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        .error-message {
            font-size: 13px;
            color: #e74c3c;
            margin-top: 4px;
            min-height: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:focus-visible {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }

        .aria-info {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #636e72;
        }

        .aria-info code {
            background: #e9ecef;
            padding: 1px 5px;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Form Aksesibel</h2>
        <form id="ariaForm" novalidate aria-label="Form kontak">
            <div class="form-group">
                <label for="name">Nama Lengkap <span aria-hidden="true">*</span></label>
                <input type="text" id="name" name="name" placeholder="Nama lengkap" aria-required="true"
                    aria-describedby="nameError">
                <div class="error-message" id="nameError" role="alert" aria-live="polite"></div>
            </div>
            <div class="form-group">
                <label for="email">Email <span aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com" aria-required="true"
                    aria-describedby="emailError">
                <div class="error-message" id="emailError" role="alert" aria-live="polite"></div>
            </div>
            <div class="form-group">
                <label for="msg">Pesan <span aria-hidden="true">*</span></label>
                <textarea id="msg" name="message" placeholder="Pesan Anda" aria-required="true"
                    aria-describedby="msgError"></textarea>
                <div class="error-message" id="msgError" role="alert" aria-live="polite"></div>
            </div>
            <button type="submit" class="submit-btn" aria-label="Kirim pesan">Kirim Pesan</button>
        </form>
        <div class="aria-info">
            <p><strong>ARIA attributes used:</strong></p>
            <code>aria-required</code> · <code>aria-describedby</code> · <code>aria-invalid</code> ·
            <code>role="alert"</code> · <code>aria-live="polite"</code> · <code>aria-label</code>
        </div>
    </div>
    <script>
        const form = document.getElementById('ariaForm');
        function validate(id) {
            const el = document.getElementById(id);
            const err = document.getElementById(id + 'Error');
            const v = el.value.trim();
            let msg = '';
            if (!v) msg = 'Wajib diisi.';
            else if (id === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = 'Format email tidak valid.';
            else if (id === 'msg' && v.length < 5) msg = 'Minimal 5 karakter.';
            err.textContent = msg;
            el.setAttribute('aria-invalid', msg ? 'true' : 'false');
            err.setAttribute('aria-live', msg ? 'assertive' : 'polite');
            return !msg;
        }
        ['name', 'email', 'msg'].forEach(f => {
            document.getElementById(f).addEventListener('input', function () { validate(f); });
        });
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (['name', 'email', 'msg'].every(f => validate(f))) alert('Form siap dikirim!');
        });
    </script>
</body>

</html>
