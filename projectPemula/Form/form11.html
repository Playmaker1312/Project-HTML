<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Success Message</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-message .icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
        }

        .success-message h3 {
            font-size: 24px;
            color: #27ae60;
            margin-bottom: 8px;
        }

        .success-message p {
            color: #636e72;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .success-message .reset-btn {
            padding: 12px 32px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .form-content,
        .success-message {
            transition: opacity 0.4s ease;
        }

        .form-content.hidden,
        .success-message.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <div class="form-content" id="formContent">
            <h2>Hubungi Kami</h2>
            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="name">Nama</label>
                    <input type="text" id="name" placeholder="Nama lengkap">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="contoh@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Pesan</label>
                    <textarea id="message" placeholder="Pesan Anda"></textarea>
                </div>
                <button type="submit" class="submit-btn">Kirim Pesan</button>
            </form>
        </div>
        <div class="success-message" id="successMessage">
            <span class="icon">✓</span>
            <h3>Pesan Terkirim!</h3>
            <p>Terima kasih telah menghubungi kami. Tim kami akan merespon pesan Anda dalam 1x24 jam.</p>
            <button class="reset-btn" id="resetBtn">Kirim Pesan Lagi</button>
        </div>
    </div>
    <script>
        const form = document.getElementById('contactForm');
        const formContent = document.getElementById('formContent');
        const successDiv = document.getElementById('successMessage');
        const resetBtn = document.getElementById('resetBtn');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const valid = ['name', 'email', 'message'].every(f => {
                const el = document.getElementById(f);
                if (!el.value.trim()) { el.style.borderColor = '#e74c3c'; return false; }
                return true;
            });
            if (valid) {
                formContent.style.display = 'none';
                successDiv.style.display = 'block';
            }
        });
        resetBtn.addEventListener('click', function () {
            form.reset();
            document.querySelectorAll('input, textarea').forEach(el => el.style.borderColor = '#e0e0e0');
            successDiv.style.display = 'none';
            formContent.style.display = 'block';
        });
    </script>
</body>

</html>
