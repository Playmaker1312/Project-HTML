<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Loading State</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 480px;
            background: white;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .submit-btn.loading .spinner {
            display: inline-block;
        }

        .submit-btn.loading .btn-text {}

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Loading State Demo</h2>
        <form id="loadingForm" novalidate>
            <div class="form-group">
                <label for="name">Nama</label>
                <input type="text" id="name" placeholder="Nama Anda" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="contoh@email.com" required>
            </div>
            <div class="form-group">
                <label for="msg">Pesan</label>
                <textarea id="msg" placeholder="Pesan Anda" required></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="spinner"></span>
                <span class="btn-text">Kirim Pesan</span>
            </button>
        </form>
    </div>
    <script>
        const form = document.getElementById('loadingForm');
        const btn = document.getElementById('submitBtn');
        const btnText = btn.querySelector('.btn-text');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const valid = ['name', 'email', 'msg'].every(f => {
                const el = document.getElementById(f);
                if (!el.value.trim()) { el.style.borderColor = '#e74c3c'; return false; }
                return true;
            });
            if (!valid) return;
            btn.classList.add('loading');
            btn.disabled = true;
            btnText.textContent = 'Mengirim...';
            setTimeout(function () {
                btn.classList.remove('loading');
                btn.disabled = false;
                btnText.textContent = 'Kirim Pesan';
                alert('Pesan berhasil dikirim!');
            }, 2000);
        });
        ['name', 'email', 'msg'].forEach(f => {
            document.getElementById(f).addEventListener('input', function () { this.style.borderColor = '#e0e0e0'; });
        });
    </script>
</body>

</html>
