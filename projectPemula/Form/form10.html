<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Shake Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        input.error {
            border-color: #e74c3c;
        }

        .error-message {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 4px;
            min-height: 18px;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            50%,
            90% {
                transform: translateX(-6px);
            }

            30%,
            70% {
                transform: translateX(6px);
            }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #5a6fd6;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Shake on Error</h2>
        <form id="shakeForm" novalidate>
            <div class="form-group">
                <label for="name">Nama <span style="color:#e74c3c;">*</span></label>
                <input type="text" id="name" placeholder="Wajib diisi" class="error">
                <div class="error-message" id="nameError">Nama wajib diisi.</div>
            </div>
            <div class="form-group">
                <label for="email">Email <span style="color:#e74c3c;">*</span></label>
                <input type="email" id="email" placeholder="contoh@email.com" class="error">
                <div class="error-message" id="emailError">Format email tidak valid.</div>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('shakeForm');
        function validate(id) {
            const el = document.getElementById(id);
            const err = document.getElementById(id + 'Error');
            const v = el.value.trim();
            let msg = '';
            if (!v) msg = 'Wajib diisi.';
            else if (id === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = 'Format email tidak valid.';
            el.className = msg ? 'error' : '';
            err.textContent = msg;
            return !msg;
        }
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const valid = ['name', 'email'].every(f => validate(f));
            if (!valid) {
                form.classList.remove('shake');
                void form.offsetWidth;
                form.classList.add('shake');
                setTimeout(() => form.classList.remove('shake'), 500);
            } else {
                alert('Form berhasil dikirim!');
            }
        });
        document.getElementById('name').addEventListener('input', function () { validate('name'); });
        document.getElementById('email').addEventListener('input', function () { validate('email'); });
    </script>
</body>

</html>
