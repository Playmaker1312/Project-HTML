<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Real-time Validasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .error-message {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 4px;
            min-height: 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Contact Form</h2>
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="name">Nama</label>
                <input type="text" id="name" placeholder="Min 3 karakter">
                <div class="error-message" id="nameError"></div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="contoh@email.com">
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <label for="subject">Subjek</label>
                <input type="text" id="subject" placeholder="Min 3 karakter">
                <div class="error-message" id="subjectError"></div>
            </div>
            <div class="form-group">
                <label for="message">Pesan</label>
                <textarea id="message" placeholder="Min 10 karakter"></textarea>
                <div class="error-message" id="messageError"></div>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Kirim Pesan</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('contactForm');
        const fields = ['name', 'email', 'subject', 'message'];
        const errorEls = {};
        fields.forEach(f => { errorEls[f] = document.getElementById(f + 'Error'); });
        function validateField(id) {
            const el = document.getElementById(id);
            const val = el.value.trim();
            let error = '';
            if (!val) error = 'Field ini wajib diisi.';
            else if (id === 'name' && val.length < 3) error = 'Nama minimal 3 karakter.';
            else if (id === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) error = 'Format email tidak valid.';
            else if (id === 'subject' && val.length < 3) error = 'Subjek minimal 3 karakter.';
            else if (id === 'message' && val.length < 10) error = 'Pesan minimal 10 karakter.';
            errorEls[id].textContent = error;
            el.style.borderColor = error ? '#e74c3c' : '#27ae60';
            return !error;
        }
        fields.forEach(f => {
            document.getElementById(f).addEventListener('input', function () { validateField(f); checkForm(); });
        });
        function checkForm() {
            const valid = fields.every(f => validateField(f));
            document.getElementById('submitBtn').disabled = !valid;
        }
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (fields.every(f => validateField(f))) alert('Form berhasil dikirim!');
        });
        checkForm();
    </script>
</body>

</html>
