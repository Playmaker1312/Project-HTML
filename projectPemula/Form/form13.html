<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - localStorage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #636e72;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .draft-notice {
            display: none;
            font-size: 12px;
            color: #f39c12;
            text-align: center;
            margin-top: 12px;
            padding: 8px;
            background: #fff8e1;
            border-radius: 8px;
        }

        .draft-notice.visible {
            display: block;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Hubungi Kami</h2>
        <p class="subtitle">Data akan disimpan otomatis sebagai draft</p>
        <div class="draft-notice" id="draftNotice">Draft tersimpan. Data sebelumnya telah dipulihkan.</div>
        <form id="draftForm" novalidate>
            <div class="form-group">
                <label for="name">Nama</label>
                <input type="text" id="name" placeholder="Nama lengkap">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="contoh@email.com">
            </div>
            <div class="form-group">
                <label for="subject">Subjek</label>
                <input type="text" id="subject" placeholder="Subjek">
            </div>
            <div class="form-group">
                <label for="message">Pesan</label>
                <textarea id="message" placeholder="Tulis pesan..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Kirim</button>
        </form>
    </div>
    <script>
        const fields = ['name', 'email', 'subject', 'message'];
        const STORAGE_KEY = 'contactFormDraft';
        function saveDraft() {
            const data = {};
            fields.forEach(f => data[f] = document.getElementById(f).value);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        function restoreDraft() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;
            try {
                const data = JSON.parse(saved);
                let hasData = false;
                fields.forEach(f => {
                    if (data[f]) { document.getElementById(f).value = data[f]; hasData = true; }
                });
                if (hasData) document.getElementById('draftNotice').classList.add('visible');
            } catch (e) { }
        }
        function clearDraft() {
            localStorage.removeItem(STORAGE_KEY);
            document.getElementById('draftNotice').classList.remove('visible');
        }
        fields.forEach(f => document.getElementById(f).addEventListener('input', saveDraft));
        document.getElementById('draftForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Form berhasil dikirim!');
            this.reset();
            clearDraft();
        });
        restoreDraft();
    </script>
</body>

</html>
