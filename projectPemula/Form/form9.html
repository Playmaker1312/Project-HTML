<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Character Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        .char-counter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 12px;
        }

        .char-counter .count {
            color: #636e72;
        }

        .char-counter .count.warning {
            color: #f39c12;
        }

        .char-counter .count.danger {
            color: #e74c3c;
        }

        .char-counter .hint {
            color: #aaa;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Karakter Counter</h2>
        <form id="counterForm" novalidate>
            <div class="form-group">
                <label for="name">Nama</label>
                <input type="text" id="name" placeholder="Nama Anda">
            </div>
            <div class="form-group">
                <label for="message">Pesan</label>
                <textarea id="message" placeholder="Tulis pesan Anda di sini..." maxlength="500"></textarea>
                <div class="char-counter">
                    <span class="hint">Minimal 10 karakter</span>
                    <span class="count" id="charCount">0 / 500</span>
                </div>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Kirim</button>
        </form>
    </div>
    <script>
        const message = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        const maxLength = 500;
        message.addEventListener('input', function () {
            const len = this.value.length;
            const remaining = maxLength - len;
            charCount.textContent = `${len} / ${maxLength}`;
            charCount.className = 'count';
            if (remaining < 20) charCount.classList.add('danger');
            else if (remaining < 100) charCount.classList.add('warning');
        });
        document.getElementById('counterForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Form dikirim!');
        });
    </script>
</body>

</html>
