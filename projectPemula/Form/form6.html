<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Error Messages</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        input.error,
        textarea.error {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        input.valid,
        textarea.valid {
            border-color: #27ae60;
        }

        .error-message {
            font-size: 13px;
            color: #e74c3c;
            margin-top: 4px;
            min-height: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .error-message::before {
            content: '!';
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 16px;
            height: 16px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Error Messages</h2>
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" placeholder="Masukkan nama lengkap">
                <div class="error-message" id="nameError"></div>
            </div>
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" placeholder="contoh@email.com">
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <label for="subject">Subjek</label>
                <input type="text" id="subject" placeholder="Subjek pesan">
                <div class="error-message" id="subjectError"></div>
            </div>
            <div class="form-group">
                <label for="message">Pesan</label>
                <textarea id="message" placeholder="Tulis pesan Anda"></textarea>
                <div class="error-message" id="messageError"></div>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Kirim Pesan</button>
        </form>
    </div>
    <script>
        const fields = ['name', 'email', 'subject', 'message'];
        const errors = {};
        fields.forEach(f => errors[f] = document.getElementById(f + 'Error'));
        function validate(id) {
            const el = document.getElementById(id);
            const v = el.value.trim();
            let msg = '';
            if (!v) msg = 'Wajib diisi.';
            else if (id === 'name' && v.length < 3) msg = 'Minimal 3 karakter.';
            else if (id === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) msg = 'Format email tidak valid. Contoh: nama@email.com';
            else if (id === 'subject' && v.length < 3) msg = 'Minimal 3 karakter.';
            else if (id === 'message' && v.length < 10) msg = 'Minimal 10 karakter.';
            errors[id].textContent = msg;
            errors[id].style.display = msg ? 'flex' : 'none';
            el.className = msg ? 'error' : (v ? 'valid' : '');
            return !msg;
        }
        fields.forEach(f => document.getElementById(f).addEventListener('input', function () { validate(f); }));
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();
            if (fields.every(f => validate(f))) alert('Sukses!');
        });
    </script>
</body>

</html>
