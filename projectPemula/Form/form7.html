<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form - Email Regex</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #2d3436;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        input.invalid {
            border-color: #e74c3c;
            background: #fff5f5;
        }

        input.valid {
            border-color: #27ae60;
        }

        .error-message {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 4px;
            min-height: 18px;
        }

        .info {
            font-size: 12px;
            color: #636e72;
            margin-top: 4px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .regex-test {
            margin-top: 16px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            color: #636e72;
        }

        .regex-test code {
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Validasi Email dengan Regex</h2>
        <form id="emailForm" novalidate>
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" placeholder="contoh@email.com">
                <div class="error-message" id="emailError"></div>
                <div class="info" id="emailInfo">Coba: user@domain.com, user@domain.co.id</div>
            </div>
            <div class="form-group">
                <label for="name">Nama</label>
                <input type="text" id="name" placeholder="Nama Anda">
                <div class="error-message" id="nameError"></div>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Kirim</button>
        </form>
        <div class="regex-test">
            <p><strong>Regex yang digunakan:</strong></p>
            <code>/^[^\s@]+@[^\s@]+\.[^\s@]+$/</code>
        </div>
    </div>
    <script>
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const nameInput = document.getElementById('name');
        const nameError = document.getElementById('nameError');
        const submitBtn = document.getElementById('submitBtn');
        function validateEmail() {
            const val = emailInput.value.trim();
            let msg = '';
            if (!val) msg = 'Email wajib diisi.';
            else if (emailRegex.test(val)) { emailInput.className = 'valid'; msg = ''; }
            else msg = 'Format email tidak valid. Pastikan mengandung @ dan domain.';
            emailError.textContent = msg;
            emailInput.className = msg ? 'invalid' : (val ? 'valid' : '');
            return !msg;
        }
        function validateName() {
            const val = nameInput.value.trim();
            let msg = '';
            if (!val) msg = 'Nama wajib diisi.';
            else if (val.length < 3) msg = 'Minimal 3 karakter.';
            nameError.textContent = msg;
            nameInput.className = msg ? 'invalid' : 'valid';
            return !msg;
        }
        function checkForm() { submitBtn.disabled = !(validateEmail() && validateName()); }
        emailInput.addEventListener('input', function () { validateEmail(); checkForm(); });
        nameInput.addEventListener('input', function () { validateName(); checkForm(); });
        document.getElementById('emailForm').addEventListener('submit', function (e) {
            e.preventDefault();
            if (validateEmail() && validateName()) alert('Email valid! Form siap dikirim.');
        });
        checkForm();
    </script>
</body>

</html>
