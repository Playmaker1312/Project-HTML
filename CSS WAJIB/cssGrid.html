<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        .grid-demo {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #2c3e50;
            margin-top: 30px;
        }

        .grid {
            display: grid;
            gap: 10px;
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .equal-cols {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-item {
            background: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
        }

        .span-demo {
            grid-template-columns: 1fr 2fr;
        }

        .span-demo .header {
            grid-column: 1 / 3;
            background: #2c3e50;
        }

        .span-demo .sidebar {
            background: #e67e22;
        }

        .span-demo .main {
            background: #27ae60;
        }

        .span-demo .footer {
            grid-column: 1 / 3;
            background: #2c3e50;
        }

        .areas-demo {
            grid-template-columns: 200px 1fr;
            grid-template-rows: auto 1fr auto;
            grid-template-areas: "header header" "nav main" "sidebar main" "footer footer";
            min-height: 300px;
        }

        .area-header {
            grid-area: header;
            background: #2c3e50;
        }

        .area-nav {
            grid-area: nav;
            background: #e67e22;
        }

        .area-main {
            grid-area: main;
            background: #27ae60;
        }

        .area-side {
            grid-area: sidebar;
            background: #9b59b6;
        }

        .area-footer {
            grid-area: footer;
            background: #2c3e50;
        }
    </style>
</head>

<body>
    <div class="grid-demo">
        <h1>CSS Grid Layout</h1>

        <h2>Grid Kolom Sama (repeat 3, 1fr)</h2>
        <div class="grid equal-cols">
            <div class="grid-item">1</div>
            <div class="grid-item">2</div>
            <div class="grid-item">3</div>
            <div class="grid-item">4</div>
            <div class="grid-item">5</div>
            <div class="grid-item">6</div>
        </div>

        <h2>Grid dengan Span</h2>
        <div class="grid span-demo">
            <div class="grid-item header">Header (span 3 kolom)</div>
            <div class="grid-item sidebar">Sidebar</div>
            <div class="grid-item main">Main Content</div>
            <div class="grid-item footer">Footer (span 3 kolom)</div>
        </div>

        <h2>Grid Template Areas</h2>
        <div class="grid areas-demo">
            <div class="grid-item area-header">Header</div>
            <div class="grid-item area-nav">Nav</div>
            <div class="grid-item area-main">Main</div>
            <div class="grid-item area-side">Sidebar</div>
            <div class="grid-item area-footer">Footer</div>
        </div>
    </div>
</body>

</html>
