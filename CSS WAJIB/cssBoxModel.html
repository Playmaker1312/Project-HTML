<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box-model-demo {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .box {
            width: 200px;
            height: 200px;
            margin: 25px auto;
            padding: 20px;
            border: 5px solid #e74c3c;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .label {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 4px;
        }

        .info {
            background: #f0f8ff;
            padding: 15px 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
            color: #555;
        }

        .box-comparison {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 30px;
        }

        .box-content-box {
            box-sizing: content-box;
            width: 200px;
            background: #e74c3c;
            margin: 10px;
        }

        .box-border-box {
            box-sizing: border-box;
            width: 200px;
            background: #27ae60;
            margin: 10px;
        }

        .box-content-box span,
        .box-border-box span {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="box-model-demo">
        <h1>CSS Box Model</h1>
        <div class="box" id="box1">
            <span class="label">Content</span>
        </div>
        <div class="info">
            <p>Total lebar: 300px (content 200px + padding 20px*2 + border 5px*2 + margin 25px*2)</p>
            <p>Inspect elemen ini di DevTools &gt; Computed &gt; Box Model</p>
        </div>
        <div class="box-comparison">
            <div class="box box-content-box">
                <span>content-box</span>
            </div>
            <div class="box box-border-box">
                <span>border-box</span>
            </div>
        </div>
    </div>
</body>

</html>
