<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Theming Demo</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #2c3e50;
            --text-secondary: #666;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --border: #e0e0e0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
        }

        .dark-theme {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #64b5f6;
            --accent-hover: #90caf9;
            --border: #333;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --card-bg: #16213e;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .theme-demo {
            max-width: 600px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .theme-info {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .card-theme {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .card-theme h2 {
            color: var(--text-primary);
        }

        .card-theme p {
            color: var(--text-secondary);
        }

        .btn-primary,
        #btnTheme {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: white;
            cursor: pointer;
        }

        .btn-primary:hover,
        #btnTheme:hover {
            background: var(--accent-hover);
        }

        #themeLabel {
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>

<body class="light-theme">
    <div class="theme-demo">
        <h1>CSS Theming dengan Custom Properties</h1>
        <p>Klik tombol untuk toggle Light/Dark mode.</p>
        <button id="btnTheme">Toggle Dark Mode</button>
        <div class="theme-info">
            <p>Current theme: <span id="themeLabel">Light</span></p>
        </div>
        <div class="card-theme">
            <h2>Card dengan Theming</h2>
            <p>Ini adalah card yang warnanya mengikuti tema aktif. Background, text, dan border semua menggunakan CSS
                variables.</p>
            <button class="btn-primary">Tombol</button>
        </div>
    </div>
    <script>
        var btnTheme = document.getElementById('btnTheme');
        var themeLabel = document.getElementById('themeLabel');
        var body = document.body;

        btnTheme.addEventListener('click', function () {
            body.classList.toggle('dark-theme');
            var isDark = body.classList.contains('dark-theme');
            themeLabel.textContent = isDark ? 'Dark' : 'Light';
            btnTheme.textContent = isDark ? 'Toggle Light Mode' : 'Toggle Dark Mode';
        });
    </script>
</body>

</html>
