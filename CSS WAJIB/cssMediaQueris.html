<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f6fa;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav {
            display: flex;
            gap: 16px;
        }

        .nav a {
            text-decoration: none;
            color: #3498db;
        }

        .page-main {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        .content-section {
            flex: 2;
        }

        .content-sidebar {
            flex: 1;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 20px 0;
        }

        .card {
            background: #3498db;
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .page-main {
                flex-direction: column;
            }

            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .page-header {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .card-grid {
                grid-template-columns: 1fr;
            }

            .nav {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="page-header">
            <h1>Responsive Design</h1>
            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </nav>
        </header>
        <main class="page-main">
            <section class="content-section">
                <h2>Konten Utama</h2>
                <p>Resize browser untuk melihat perubahan layout. Media queries membuat halaman ini responsif di semua
                    ukuran layar.</p>
            </section>
            <aside class="content-sidebar">
                <h3>Sidebar</h3>
                <p>Sidebar akan pindah ke bawah di layar kecil.</p>
            </aside>
        </main>
        <div class="card-grid">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
            <div class="card">Card 4</div>
            <div class="card">Card 5</div>
            <div class="card">Card 6</div>
        </div>
        <footer class="page-footer">
            <p>&copy; 2024 Responsive Demo</p>
        </footer>
    </div>
</body>

</html>
