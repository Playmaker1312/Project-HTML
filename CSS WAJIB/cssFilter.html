<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filter Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }

        .filter-demo {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .filter-card {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .filter-card h3 {
            margin: 0 0 12px 0;
            font-size: 0.9rem;
            color: #555;
        }

        .filter-img {
            max-width: 100%;
            border-radius: 4px;
        }

        .hover-effects {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .hover-filter {
            border-radius: 8px;
            transition: filter 0.4s ease;
            cursor: pointer;
        }

        .hf-blur:hover {
            filter: blur(4px);
        }

        .hf-gray:hover {
            filter: grayscale(1);
        }

        .hf-bright:hover {
            filter: brightness(1.5) contrast(1.2);
        }
    </style>
</head>

<body>
    <div class="filter-demo">
        <h1>CSS Filter</h1>

        <div class="filter-grid">
            <div class="filter-card">
                <h3>Original</h3>
                <img src="https://via.placeholder.com/200x150/3498db/ffffff?text=Original" alt="original"
                    class="filter-img">
            </div>
            <div class="filter-card">
                <h3>blur(4px)</h3>
                <img src="https://via.placeholder.com/200x150/e74c3c/ffffff?text=Blur" alt="blur" class="filter-img"
                    style="filter: blur(4px);">
            </div>
            <div class="filter-card">
                <h3>brightness(150%)</h3>
                <img src="https://via.placeholder.com/200x150/2ecc71/ffffff?text=Bright" alt="brightness"
                    class="filter-img" style="filter: brightness(1.5);">
            </div>
            <div class="filter-card">
                <h3>contrast(200%)</h3>
                <img src="https://via.placeholder.com/200x150/9b59b6/ffffff?text=Contrast" alt="contrast"
                    class="filter-img" style="filter: contrast(2);">
            </div>
            <div class="filter-card">
                <h3>grayscale(100%)</h3>
                <img src="https://via.placeholder.com/200x150/e67e22/ffffff?text=Grayscale" alt="grayscale"
                    class="filter-img" style="filter: grayscale(1);">
            </div>
            <div class="filter-card">
                <h3>sepia(80%)</h3>
                <img src="https://via.placeholder.com/200x150/1abc9c/ffffff?text=Sepia" alt="sepia" class="filter-img"
                    style="filter: sepia(0.8);">
            </div>
            <div class="filter-card">
                <h3>hue-rotate(180deg)</h3>
                <img src="https://via.placeholder.com/200x150/f1c40f/000000?text=Hue" alt="hue-rotate"
                    class="filter-img" style="filter: hue-rotate(180deg);">
            </div>
            <div class="filter-card">
                <h3>drop-shadow</h3>
                <img src="https://via.placeholder.com/200x150/34495e/ffffff?text=Shadow" alt="drop-shadow"
                    class="filter-img" style="filter: drop-shadow(8px 8px 10px rgba(0,0,0,0.5));">
            </div>
        </div>

        <h2 style="margin-top:40px;">Interactive Hover Effects</h2>
        <div class="hover-effects">
            <img src="https://via.placeholder.com/150x150/2c3e50/ffffff?text=Hover+1" alt="hover1"
                class="hover-filter hf-blur">
            <img src="https://via.placeholder.com/150x150/8e44ad/ffffff?text=Hover+2" alt="hover2"
                class="hover-filter hf-gray">
            <img src="https://via.placeholder.com/150x150/d35400/ffffff?text=Hover+3" alt="hover3"
                class="hover-filter hf-bright">
        </div>
    </div>
</body>

</html>
