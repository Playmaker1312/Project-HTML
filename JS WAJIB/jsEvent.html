<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Listener Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .event-demo {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .interactive-area {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .interactive-area button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: white;
            cursor: pointer;
        }

        .interactive-area button:hover {
            background: #2980b9;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .input-area input,
        .input-area select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .mouse-area {
            width: 100%;
            height: 120px;
            background: #f0f8ff;
            border: 2px dashed #3498db;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .mouse-coords {
            margin-top: 10px;
            font-family: monospace;
            font-size: 14px;
        }

        .event-log {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
            max-height: 150px;
            overflow-y: auto;
        }

        #logMessages {
            font-size: 13px;
            font-family: monospace;
        }

        .clear-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #95a5a6;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="event-demo">
        <h1>Event Listener</h1>

        <div class="interactive-area">
            <button id="btnClick">Klik Saya</button>
            <button id="btnDoubleClick">Double Klik</button>
            <button id="btnHover">Hover Saya</button>
        </div>

        <div class="input-area">
            <label for="textInput">Ketik sesuatu:</label>
            <input type="text" id="textInput" placeholder="Ketik di sini...">
            <select id="selectDemo">
                <option value="">Pilih...</option>
                <option value="opsi1">Opsi 1</option>
                <option value="opsi2">Opsi 2</option>
            </select>
        </div>

        <div class="mouse-area" id="mouseArea">
            Gerakan mouse di sini
            <div class="mouse-coords">X: <span id="coordX">0</span> | Y: <span id="coordY">0</span></div>
        </div>

        <div id="eventLog" class="event-log">
            <p><strong>Event Log:</strong></p>
            <div id="logMessages">Menunggu event...</div>
        </div>

        <button id="btnClearLog" class="clear-btn">Hapus Log</button>
    </div>
    <script>
        var log = document.getElementById('logMessages');
        var count = 0;

        function addLog(msg) {
            count++;
            var entry = document.createElement('div');
            entry.textContent = count + '. ' + msg;
            log.appendChild(entry);
            log.parentElement.scrollTop = log.parentElement.scrollHeight;
        }

        document.getElementById('btnClick').addEventListener('click', function () {
            addLog('Click: tombol "Klik Saya" diklik');
        });

        document.getElementById('btnDoubleClick').addEventListener('dblclick', function () {
            addLog('Double Click: tombol didouble-klik');
        });

        document.getElementById('btnHover').addEventListener('mouseover', function () {
            addLog('Mouseover: mouse masuk ke tombol Hover');
        });
        document.getElementById('btnHover').addEventListener('mouseout', function () {
            addLog('Mouseout: mouse keluar dari tombol Hover');
        });

        document.getElementById('textInput').addEventListener('keydown', function (e) {
            addLog('Keydown: tombol "' + e.key + '" ditekan');
        });
        document.getElementById('textInput').addEventListener('input', function () {
            addLog('Input: nilai berubah menjadi "' + this.value + '"');
        });
        document.getElementById('textInput').addEventListener('focus', function () {
            addLog('Focus: input menerima fokus');
        });
        document.getElementById('textInput').addEventListener('blur', function () {
            addLog('Blur: input kehilangan fokus');
        });

        document.getElementById('selectDemo').addEventListener('change', function () {
            addLog('Change: select berubah menjadi "' + this.value + '"');
        });

        document.getElementById('mouseArea').addEventListener('mousemove', function (e) {
            document.getElementById('coordX').textContent = e.offsetX;
            document.getElementById('coordY').textContent = e.offsetY;
        });

        document.getElementById('btnClearLog').addEventListener('click', function () {
            log.innerHTML = '';
            count = 0;
            addLog('Log dibersihkan');
        });

        addLog('Event listeners siap!');
    </script>
</body>

</html>
