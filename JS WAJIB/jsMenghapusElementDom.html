<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Element Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .remove-demo {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .card-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 20px 0;
        }

        .demo-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f0f8ff;
            border: 1px solid #d6e9f8;
            border-radius: 6px;
        }

        .btn-delete {
            padding: 4px 12px;
            border: none;
            border-radius: 4px;
            background: #e74c3c;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .remove-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .remove-controls button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            background: #3498db;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }

        .remove-controls button:hover {
            background: #2980b9;
        }

        .remove-log {
            margin-top: 16px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace;
            min-height: 30px;
        }
    </style>
</head>

<body>
    <div class="remove-demo">
        <h1>Menghapus Elemen DOM</h1>

        <div class="card-container" id="cardContainer">
            <div class="demo-card" data-id="1">
                <span>Card 1</span>
                <button class="btn-delete">X</button>
            </div>
            <div class="demo-card" data-id="2">
                <span>Card 2</span>
                <button class="btn-delete">X</button>
            </div>
            <div class="demo-card" data-id="3">
                <span>Card 3</span>
                <button class="btn-delete">X</button>
            </div>
            <div class="demo-card" data-id="4">
                <span>Card 4</span>
                <button class="btn-delete">X</button>
            </div>
        </div>

        <div class="remove-controls">
            <button id="btnRemoveFirst">Hapus Card Pertama (removeChild)</button>
            <button id="btnRemoveLast">Hapus Card Terakhir (remove)</button>
            <button id="btnReplaceCard">Ganti Card 2</button>
            <button id="btnResetCards">Reset Cards</button>
        </div>

        <div id="removeLog" class="remove-log"></div>
    </div>
    <script>
        var container = document.getElementById('cardContainer');
        var log = document.getElementById('removeLog');
        var cardId = 5;

        function logMsg(msg) {
            log.textContent = msg;
        }

        function addDeleteListeners() {
            var deleteBtns = document.querySelectorAll('.btn-delete');
            for (var i = 0; i < deleteBtns.length; i++) {
                deleteBtns[i].addEventListener('click', function () {
                    var card = this.parentElement;
                    var id = card.getAttribute('data-id');
                    card.remove();
                    logMsg('Card ' + id + ' dihapus dengan remove()');
                });
            }
        }

        document.getElementById('btnRemoveFirst').addEventListener('click', function () {
            var firstCard = container.querySelector('.demo-card');
            if (firstCard) {
                var id = firstCard.getAttribute('data-id');
                container.removeChild(firstCard);
                logMsg('Card ' + id + ' dihapus dengan removeChild()');
            } else {
                logMsg('Tidak ada card yang bisa dihapus');
            }
        });

        document.getElementById('btnRemoveLast').addEventListener('click', function () {
            var cards = container.querySelectorAll('.demo-card');
            if (cards.length > 0) {
                var lastCard = cards[cards.length - 1];
                var id = lastCard.getAttribute('data-id');
                lastCard.remove();
                logMsg('Card ' + id + ' dihapus dengan remove()');
            } else {
                logMsg('Tidak ada card yang bisa dihapus');
            }
        });

        document.getElementById('btnReplaceCard').addEventListener('click', function () {
            var card2 = container.querySelector('[data-id="2"]');
            if (card2) {
                var newCard = document.createElement('div');
                newCard.className = 'demo-card';
                newCard.setAttribute('data-id', 'new');
                newCard.innerHTML = '<span>Card Baru (pengganti)</span><button class="btn-delete">X</button>';
                container.replaceChild(newCard, card2);
                addDeleteListeners();
                logMsg('Card 2 diganti dengan card baru');
            } else {
                logMsg('Card 2 sudah tidak ada');
            }
        });

        document.getElementById('btnResetCards').addEventListener('click', function () {
            container.innerHTML = '';
            var cards = [
                { id: 1, text: 'Card 1' },
                { id: 2, text: 'Card 2' },
                { id: 3, text: 'Card 3' },
                { id: 4, text: 'Card 4' }
            ];
            for (var i = 0; i < cards.length; i++) {
                var div = document.createElement('div');
                div.className = 'demo-card';
                div.setAttribute('data-id', cards[i].id);
                div.innerHTML = '<span>' + cards[i].text + '</span><button class="btn-delete">X</button>';
                container.appendChild(div);
            }
            addDeleteListeners();
            logMsg('Card di-reset ke awal');
        });

        addDeleteListeners();
        logMsg('Klik X pada card atau tombol kontrol');
    </script>
</body>

</html>
