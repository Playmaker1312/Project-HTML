<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Manipulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .style-demo {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .style-box {
            width: 200px;
            height: 100px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ecf0f1;
            border-radius: 8px;
            font-weight: bold;
            color: #2c3e50;
            transition: all 0.3s;
        }

        .style-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }

        .control-group h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #555;
        }

        .control-group button {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            background: #3498db;
            color: white;
            cursor: pointer;
            margin: 3px;
            font-size: 12px;
        }

        .control-group button:hover {
            background: #2980b9;
        }

        .style-output {
            margin-top: 20px;
            padding: 12px;
            background: #f0f8ff;
            border-radius: 8px;
        }

        #cssDisplay {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            min-height: 40px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="style-demo">
        <h1>Manipulasi Style dengan element.style</h1>

        <div id="targetStyle" class="style-box">
            Style akan berubah
        </div>

        <div class="style-controls">
            <div class="control-group">
                <h3>Warna & Background</h3>
                <button id="btnRed">Background Merah</button>
                <button id="btnBlue">Background Biru</button>
                <button id="btnGradient">Gradient</button>
            </div>

            <div class="control-group">
                <h3>Ukuran & Bentuk</h3>
                <button id="btnBigger">Perbesar</button>
                <button id="btnRound">Bulatkan</button>
                <button id="btnRotate">Putar 45deg</button>
            </div>

            <div class="control-group">
                <h3>Lainnya</h3>
                <button id="btnBorder">Tambah Border</button>
                <button id="btnHide">Sembunyikan</button>
                <button id="btnResetStyle">Reset</button>
            </div>
        </div>

        <div id="styleOutput" class="style-output">
            <p>CSS yang diterapkan:</p>
            <pre id="cssDisplay">-</pre>
        </div>
    </div>
    <script>
        var box = document.getElementById('targetStyle');
        var cssDisplay = document.getElementById('cssDisplay');

        function showCSS() {
            cssDisplay.textContent = 'background: ' + box.style.background + '\n' +
                'width: ' + box.style.width + '\n' +
                'height: ' + box.style.height + '\n' +
                'border-radius: ' + box.style.borderRadius + '\n' +
                'transform: ' + box.style.transform + '\n' +
                'display: ' + box.style.display;
        }

        document.getElementById('btnRed').addEventListener('click', function () {
            box.style.background = '#e74c3c';
            box.style.color = 'white';
            showCSS();
        });

        document.getElementById('btnBlue').addEventListener('click', function () {
            box.style.background = '#3498db';
            box.style.color = 'white';
            showCSS();
        });

        document.getElementById('btnGradient').addEventListener('click', function () {
            box.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
            box.style.color = 'white';
            showCSS();
        });

        document.getElementById('btnBigger').addEventListener('click', function () {
            box.style.width = '250px';
            box.style.height = '150px';
            showCSS();
        });

        document.getElementById('btnRound').addEventListener('click', function () {
            box.style.borderRadius = '50px';
            showCSS();
        });

        document.getElementById('btnRotate').addEventListener('click', function () {
            box.style.transform = 'rotate(45deg)';
            showCSS();
        });

        document.getElementById('btnBorder').addEventListener('click', function () {
            box.style.border = '4px solid #2c3e50';
            showCSS();
        });

        document.getElementById('btnHide').addEventListener('click', function () {
            if (box.style.display !== 'none') {
                box.style.display = 'none';
            } else {
                box.style.display = 'flex';
            }
            showCSS();
        });

        document.getElementById('btnResetStyle').addEventListener('click', function () {
            box.style.cssText = '';
            box.className = 'style-box';
            showCSS();
        });

        showCSS();
    </script>
</body>

</html>
